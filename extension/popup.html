<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 상장회사 정보 대시보드</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="popup-container">
    <h1>한국 상장회사 정보 대시보드</h1>
    <p>웹페이지에서 한국 상장회사 이름을 선택하고 마우스 오른쪽 버튼을 클릭한 후 "How is going 회사이름" 메뉴를 선택하세요.</p>
    <div class="instructions">
      <h2>사용 방법</h2>
      <ol>
        <li>웹페이지에서 회사 이름을 마우스로 선택합니다.</li>
        <li>마우스 오른쪽 버튼을 클릭합니다.</li>
        <li>"How is going 회사이름" 메뉴를 선택합니다.</li>
        <li>새 탭에서 회사 정보 대시보드가 열립니다.</li>
      </ol>
    </div>
  </div>
  <script src="js/popup.js"></script>
</body>
</html>
